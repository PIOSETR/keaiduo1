# 喵喵听写 — 自动构建 Android APK 并发布到 Release
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Sync web assets
        run: |
          rm -rf app-build/assets
          mkdir -p app-build/assets
          cp -r index.html style.css words.js game.js audio.js app.js manifest.json sw.js icon-192.png icon-512.png app-build/assets/

      - name: Build APK
        working-directory: ./app-build
        run: |
          bash build-apk.sh

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meow-dictate-apk
          path: app-build/build/meow-dictate.apk
          if-no-files-found: error

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: 喵喵听写 APK
          body: |
            🤖 最新版自动构建 APK
            
            📅 构建时间：${{ github.event.repository.updated_at }}
            📝 提交：${{ github.sha }}
            
            扫码或点击下方链接下载安装到安卓手机。
          artifacts: app-build/build/meow-dictate.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true