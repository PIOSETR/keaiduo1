# 喵喵听写 — 自动构建 Android APK
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets to Android
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r index.html style.css words.js game.js audio.js app.js manifest.json sw.js icon-192.png icon-512.png android/app/src/main/assets/public/

      - name: Build APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meow-dictate-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error